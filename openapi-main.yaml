  - name: Accessories
  - name: Armors
  - name: Weapons
  - name: Characters

paths:
  /users:
    post:
      tags:
        - Users
      operationId: createUser
      summary: "Create a new user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Invalid input
    get:
      tags:
        - Users
      operationId: listUsers
      summary: "List all users"
      parameters:
        - name: "sortBy"
          in: "query"
          description: "Sort by"
          required: false
          schema:
            type: "string"
        - name: "sortDirection"
          in: "query"
          description: "Sort direction"
          required: false
          schema:
            type: "string"
            enum: ["asc", "desc"]
      responses:
        '200':
          description: A list of users
  /users/{id}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: "Get user by id"
      parameters:
        - name: "id"
          in: "path"
          description: "ID of user to return"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        '200':
          description: "successful operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  password:
                    type: string
        '400':
          description: "Invalid ID supplied"
        '404':
          description: "User not found"
    put:
      tags:
        - Users
      operationId: updateUser
      summary: "Update an existing user"
      parameters:
        - name: "id"
          in: "path"
          description: "ID of user to return"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: "successful operation"
        '400':
          description: "Invalid ID supplied"
        '404':
          description: "User not found"
    delete:
      tags:
        - Users
      operationId: deleteUser
      summary: "Delete a user"
      parameters:
        - name: "id"
          in: "path"
          description: "ID of user to return"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
